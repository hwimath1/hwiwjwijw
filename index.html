    async function saveData(game, name, score, elapsedTime) {
        const FUNCTION_URL = "https://us-central1-record-f420d.cloudfunctions.net/report";

        const requestData = {
            game,
            name,
            score: parseInt(score, 10),
            elapsedTime: parseInt(elapsedTime, 10)
        };

        try {
            const response = await fetch(FUNCTION_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            });

            const responseData = await response.json();

            if (response.ok) {
                document.getElementById('response').innerText = 
                    `성공: ${JSON.stringify(responseData, null, 2)}`;
            } else {
                document.getElementById('response').innerText = 
                    `오류: ${JSON.stringify(responseData, null, 2)}`;
            }
        } catch (error) {
            console.error('요청 실패:', error);
            document.getElementById('response').innerText = 
                `네트워크 오류: ${error.message}`;
        }
    }

        options: [
          "\\((x,y) = (2,2)\\)",

        ],

      },
      {

        options: [
          "\\((x,y) = (3,2)\\)",
          "\\((x,y) = (4,2)\\)",

          "\\((x,y) = (2,3)\\)"
        ],
        correct: 0
      },
      {
        questionText: "다음 등식을 만족하는 실수 \\(x,y\\)의 값을 구하여라. \\((2 + i)(x - yi) = -3 + i\\)",
        options: [
          "\\((x,y) = (-1,-2)\\)",
          "\\((x,y) = (-1,-1)\\)",
          "\\((x,y) = (1,1)\\)",
          "\\((x,y) = (2,-1)\\)"
        ],
        correct: 1
      },
      {
        questionText: "다음 등식을 만족하는 실수 \\(x,y\\)의 값을 구하여라. \\((1 - 2i)(x - yi) = \\sqrt{3} - 4i\\)",
        options: [
          "\\((x,y) = (-1,-2)\\)",
          "\\((x,y) = (1,-2)\\)",
          "\\((x,y) = (-1,1)\\)",
          "\\((x,y) = (3,2)\\)"
        ],
        correct: 0
      },
      {
        questionText: "다음 등식을 만족하는 실수 \\(x,y\\)의 값을 구하여라. \\(\\dfrac{x}{1 - i} + \\dfrac{y}{1 + i} = 2 - i\\)",
        options: [
          "\\((x,y) = (1,3)\\)",
          "\\((x,y) = (2,3)\\)",

          "\\((x,y) = (0,3)\\)"
        ],
        correct: 0
      },
      // 91~95
      {
        questionText: "두 실수 \\(a, b\\)에 대하여 \\(\\dfrac{a + i}{1 - i} = 1 - b i\\) 가 성립할 때, \\(a + b\\)의 값을 구하여라.",
        options: [
          "\\(2\\)",
          "\\(3\\)",
          "\\(5\\)",
          "\\(7\\)"
        ],
        correct: 2
      },
      {
        questionText: "정수 \\(a, b\\)에 대하여 \\((2 - a i)(1 + i) = -1 + b i\\) 를 만족할 때, \\(a + b\\)의 값을 구하여라.",
        options: [
          "\\(-1\\)",
          "\\(0\\)",
          "\\(2\\)",
          "\\(4\\)"
        ],
        correct: 2
      },
      {
        questionText: "복소수 \\(z = 1 + 2i\\)일 때 \\(z + \\dfrac{10}{z}\\) 를 간단히 하여라.",
        options: [
          "\\(3 - 2i\\)",
          "\\(-3 + 2i\\)",
          "\\(2 + 3i\\)",
          "\\(3 + 2i\\)"
        ],
        correct: 0
      },
      {
        questionText: "\\(\\dfrac{x}{1 + i} + \\dfrac{y}{1 - i} = 2\\) 를 만족하는 실수 \\(x, y\\)에 대하여 \\(x + y\\)의 값을 구하여라.",
        options: [
          "\\(2\\)",
          "\\(4\\)",
          "\\(0\\)",
          "\\(1\\)"
        ],
        correct: 1
      },
      {
        questionText: "등식 \\((x + 2i)(1 - i) = 5 + y i\\) 를 만족시키는 실수 \\(x, y\\)에 대하여 \\(x - y\\)의 값을 구하여라. \\(i=\\sqrt{-1}\\)",
        options: [
          "\\(2\\)",
          "\\(3\\)",
          "\\(4\\)",

        correct: 2

    ];

    // 문제를 무작위로 섞기 위해 인덱스 배열을 섞는 함수
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    let nameValue = "";
    let difficulty = "";
    let questionsOrder = [];      // 문제 인덱스를 담을 배열
    let currentQuestionIndex = 0; // 현재 문제 순번(섞인 배열에서의 인덱스)
    let score = 0;
    let lives = 3;
    let timeLeft = 0;            // 현재 문제 시간
    let totalTime = 0;           // 전체 경과 시간(초)
    let timerInterval = null;    // setInterval용
    let totalTimeInterval = null;
    let gameInProgress = false;

    // 난이도별 최초 타이머 설정
    // 최상: 25초, 상: 35초, 중: 45초, 하: 제한없음(표시는 하지만 줄지 않게)
    // 점수: 최상=20, 상=15, 중=13, 하=10
    let baseTime = 0;
    let difficultyScore = 10;

    function startGame(diff) {
      nameValue = document.getElementById("nameInput").value.trim();
      if (!nameValue) {
        alert("이름을 입력해주세요!");
        return;
      }

      difficulty = diff;
      switch (diff) {
        case "최상":
          baseTime = 25; 
          difficultyScore = 20;
          break;
        case "상":
          baseTime = 35;
          difficultyScore = 15;
          break;
        case "중":
          baseTime = 45;
          difficultyScore = 13;
          break;
        case "하":
          baseTime = 999999; // 사실상 제한 없다고 가정
          difficultyScore = 10;
          break;
      }

      // 첫 화면 숨기고 퀴즈화면 보이기
      document.getElementById("welcomeScreen").classList.add("hidden");
      document.getElementById("quizScreen").classList.remove("hidden");

      // 문제 순서를 섞어서 모든 문제(61개) 사용
      const indices = Array.from({length: allQuestions.length}, (_,i) => i);
      shuffleArray(indices);
      questionsOrder = indices;

      currentQuestionIndex = 0;
      score = 0;
      lives = 3;
      totalTime = 0;
      document.getElementById("lifeDisplay").textContent = lives;
      document.getElementById("scoreDisplay").textContent = score;

      // 전체 경과 시간 표시용 인터벌
      totalTimeInterval = setInterval(()=>{
        if (gameInProgress) {
          totalTime++;
          document.getElementById("totalTimeDisplay").textContent = totalTime;
        }
      }, 1000);

      gameInProgress = true;
      loadQuestion();
    }

    // 문제 로딩
    function loadQuestion() {
      if (currentQuestionIndex >= questionsOrder.length) {
        // 모든 문제 소진 -> 게임 끝
        endGame("모든 문제를 풀었습니다!");
        return;
      }

      // 시간 초기화
      timeLeft = baseTime;
      if (difficulty === "하") {
        // 하 난이도는 시간 표시만, 줄지는 않게
        timeLeft = 999999;
      }

      updateTimeDisplay();
      document.getElementById("energyBarWrapper").style.display = 
        (difficulty === "하") ? "none" : "block";
      updateEnergyBar();

      // 타이머 동작
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!gameInProgress) return;
        if (difficulty !== "하") {
          timeLeft--;
          updateEnergyBar();
          if (timeLeft <= 0) {
            // 시간 소진 -> 기회 -1, 문제강제종료
            lives--;
            if (lives <= 0) {
              lives = 0;
              document.getElementById("lifeDisplay").textContent = lives;
              clearInterval(timerInterval);
              endGame("시간 초과! 남은 기회가 없습니다.");
              return;
            } else {
              document.getElementById("lifeDisplay").textContent = lives;
              // 오답 처리처럼 정답 공개 후 다음 문제
              alert("시간이 초과되었습니다. 기회가 1 감소합니다.");
              // 정답 보여주기
              const q = allQuestions[questionsOrder[currentQuestionIndex]];
              const correctOpt = q.options[q.correct];
              alert("정답: " + correctOpt);
              // 다음 문제
              currentQuestionIndex++;
              loadQuestion();
              return;
            }
          }
        }
        updateTimeDisplay();
      }, 1000);

      // 문제 표시
      showQuestion();
    }

    function updateTimeDisplay() {
      document.getElementById("timeDisplay").textContent = 
        (difficulty === "하") ? "무제한" : `남은시간`;
    }

    function updateEnergyBar() {
      const bar = document.getElementById("energyBar");
      if (difficulty === "하") {
        bar.style.width = "100%";
      } else {
        const ratio = (timeLeft / baseTime) * 100;
        bar.style.width = ratio + "%";
      }
    }

    function showQuestion() {
      const questionObj = allQuestions[questionsOrder[currentQuestionIndex]];

      // 보기 섞기? -> "보기 순서와 정답을 바꾸지 말고" 라는 요청이 있으므로 섞으면 안 됨.
      // (다만, "답이 존재하지 않는 문제"는 없으므로 전부 사용.)
      // 다만 '보기'의 순서는 이 문제에서 "원문 그대로" 유지해야 하므로 shuffle 안 함.

      // DOM 구성
      let html = `<div style="margin:20px auto; text-align:center; font-size:18px;">
        <p>${questionObj.questionText}</p>
      </div>`;

      // 보기를 그대로 출력
      questionObj.options.forEach((opt, index) => {
        html += `<button class="choice-button" onclick="checkAnswer(${index})">
                    ${opt}
                 </button>`;
      });

      document.getElementById("questionArea").innerHTML = html;

      // MathJax 렌더링
      MathJax.typeset();
    }

    function checkAnswer(selectedIdx) {
      const questionObj = allQuestions[questionsOrder[currentQuestionIndex]];
      const correctIdx = questionObj.correct;

      if (selectedIdx === correctIdx) {
        // 맞췄다
        score += difficultyScore;
        document.getElementById("scoreDisplay").textContent = score;
        alert("정답입니다! 점수 +" + difficultyScore);
      } else {
        // 틀림
        lives--;
        document.getElementById("lifeDisplay").textContent = lives;
        alert("틀렸습니다.\n정답: " + questionObj.options[correctIdx]);
        if (lives <= 0) {
          endGame("기회를 모두 소진했습니다.");
          return;
        }
      }

      // 다음 문제
      currentQuestionIndex++;
      if (timerInterval) clearInterval(timerInterval);
      // 에너지바 소진과 동일한 로직
      loadQuestion();
    }

    function endGame(msg) {
      gameInProgress = false;
      if (timerInterval) clearInterval(timerInterval);
      if (totalTimeInterval) clearInterval(totalTimeInterval);

      // 퀴즈 화면 숨기고 endScreen 표시
      document.getElementById("quizScreen").classList.add("hidden");
      document.getElementById("endScreen").classList.remove("hidden");

      document.getElementById("endTitle").textContent = msg;
      document.getElementById("finalScore").textContent = score;
    }

    function sendScore() {
      // 점수 전송
      saveData("복소수의 사칙연산", nameValue, score, totalTime);
    }
  </script>
